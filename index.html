<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 서버 없는 웹사이트</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: white;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 { margin-bottom: 1rem; font-size: 2.5rem; }
        p { font-size: 1.1rem; opacity: 0.9; }
        .badge {
            background: #4ade80;
            color: #064e3b;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>Hello, World!</h1>
        <p>이 사이트는 GitHub Pages를 통해 24시간 운영됩니다.</p>
        <p>내 컴퓨터가 꺼져도, 결제 수단이 없어도 안전합니다.</p>
        <div class="badge">HTTPS 보안 적용됨</div>
    </div>
</body>
</html>
