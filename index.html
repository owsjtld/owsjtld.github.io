<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연암 독서록 AI 채점 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f7fa; margin: 0; padding: 40px 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1a365d; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-top: 0; text-align: center; }
        
        /* 업로드 섹션 스타일 */
        .upload-section { background: #f7fafc; border: 2px dashed #cbd5e0; padding: 30px; border-radius: 8px; text-align: center; margin-bottom: 25px; }
        .upload-btn { background-color: #3182ce; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .upload-btn:hover { background-color: #2b6cb0; }
        .upload-btn:disabled { background-color: #a0aec0; cursor: not-allowed; }
        #file-input { display: none; }
        #status-message { margin-top: 15px; font-weight: bold; color: #2d3748; }

        .info-box { background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 15px; border-radius: 4px; margin-bottom: 25px; font-size: 0.95em; line-height: 1.5; }
        .student-info { font-size: 1.2em; font-weight: bold; color: #2b6cb0; margin-bottom: 20px; background: #f7fafc; padding: 10px 15px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        th { background-color: #f7fafc; color: #4a5568; font-weight: bold; }
        .score-tag { font-weight: bold; padding: 4px 10px; border-radius: 4px; }
        .score-상 { background-color: #c6f6d5; color: #22543d; }
        .score-중 { background-color: #feebc8; color: #744210; }
        .score-하 { background-color: #fed7d7; color: #742a2a; }
        .comment-box { background: #f7fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; color: #2d3748; }
        .footer { margin-top: 30px; text-align: center; font-size: 0.85em; color: #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 연암 독서록 AI 채점 시스템</h2>
    
    <div class="upload-section">
        <h3>📝 독서록 PDF 파일 제출하기</h3>
        <p id="upload-desc" style="color: #718096; font-size: 0.9em;">채점할 학생의 독서록 PDF 파일을 선택해 주세요.</p>
        <input type="file" id="file-input" accept="application/pdf">
        <button id="submit-btn" class="upload-btn" onclick="document.getElementById('file-input').click()">파일 선택 및 업로드</button>
        <div id="status-message"></div>
    </div>

    <div class="info-box">
        자동화 스케줄러가 5분마다 새 파일을 감시합니다. 제출 후 잠시 기다리시면 아래 리포트가 갱신됩니다.
    </div>

    <div id="content">
        <div class="student-info">
            👤 최근 채점 학생: <span id="student-name">대기 중</span> (글자 수: <span id="word-count">0</span>자)
        </div>
        <table>
            <thead>
                <tr><th>평가 항목</th><th>평가 등급</th></tr>
            </thead>
            <tbody>
                <tr><td>분량 감점 여부</td><td><span id="score-quantity" class="score-tag">-</span></td></tr>
                <tr><td>박지원 핵심 사상 분석</td><td><span id="score-analysis" class="score-tag">-</span></td></tr>
                <tr><td>양반 계층 비판 인식</td><td><span id="score-reflection" class="score-tag">-</span></td></tr>
                <tr><td>일상생활 실천 계획</td><td><span id="score-plan" class="score-tag">-</span></td></tr>
                <tr><td>논리적 문장 구성력</td><td><span id="score-logic" class="score-tag">-</span></td></tr>
            </tbody>
        </table>
        <h3>✍️ 전문가 종합 총평</h3>
        <div id="final-comment" class="comment-box">아직 채점된 데이터가 없거나 불러오는 중입니다.</div>
    </div>
</div>

<div class="footer">© 연암 에듀케이터 시스템 연구소.</div>

<script>
    const REPO_OWNER = "owsjtld";
    const REPO_NAME = "owsjtld.github.io";

    // URL에서 ?key=ghp_... 값을 추출하는 함수
    function getUrlParameter(name) {
        const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
        return results ? decodeURIComponent(results[1]) : null;
    }

    // 주소창에서 토큰 인증키 자동 로드
    const GITHUB_TOKEN = getUrlParameter('key');
    const submitBtn = document.getElementById('submit-btn');
    const statusId = document.getElementById('status-message');
    const uploadDesc = document.getElementById('upload-desc');

    // 토큰이 주소창에 없으면 업로드 버튼을 잠가버림 (보안 장치)
    if (!GITHUB_TOKEN || !GITHUB_TOKEN.startsWith('ghp_')) {
        submitBtn.disabled = true;
        uploadDesc.innerHTML = "<span style='color:#e53e3e; font-weight:bold;'>🔒 업로드 권한이 없습니다. 관리자 전용 링크로 접속하세요.</span>";
    }

    // 파일 업로드 처리 로직
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusId.innerText = "⏳ 깃허브 저장소로 안전하게 전송 중...";
        statusId.style.color = "#3182ce";

        try {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Content = reader.result.split(',')[1];
                
                const timestamp = new Date().getTime();
                const uploadPath = `uploads/${timestamp}_${file.name}`;
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${uploadPath}`;

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `🤖 외부 사용자 독서록 업로드: ${file.name}`,
                        content: base64Content
                    })
                });

                if (response.ok) {
                    statusId.innerHTML = "✅ 업로드 성공! 봇이 채점을 시작합니다. (약 1~3분 뒤 새로고침 하세요)";
                    statusId.style.color = "#38a169";
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "전송 실패");
                }
            };
        } catch (error) {
            statusId.innerText = "❌ 업로드 실패: 인증키가 올바르지 않거나 권한이 없습니다.";
            statusId.style.color = "#e53e3e";
            console.error(error);
        }
    });

    // 최근 채점 결과 읽어오기
    async function loadEvaluationResult() {
        try {
            const response = await fetch("./api/result.json?t=" + new Date().getTime());
            if (!response.ok) return;
            const resData = await response.json();
            if (resData.success && resData.data) {
                const evalData = resData.data;
                document.getElementById('student-name').innerText = evalData.student_name;
                document.getElementById('word-count').innerText = evalData.word_count.toLocaleString();
                document.getElementById('final-comment').innerText = evalData.final_comment;
                
                setupScore('score-quantity', evalData.scores.quantity);
                setupScore('score-analysis', evalData.scores.analysis);
                setupScore('score-reflection', evalData.scores.reflection);
                setupScore('score-plan', evalData.scores.plan);
                setupScore('score-logic', evalData.scores.logic);
            }
        } catch (e) { console.log(e); }
    }

    function setupScore(elementId, scoreValue) {
        const el = document.getElementById(elementId);
        el.innerText = scoreValue;
        el.className = `score-tag score-${scoreValue}`;
    }

    window.onload = loadEvaluationResult;
</script>
</body>
</html>
