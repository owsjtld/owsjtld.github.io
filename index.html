<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>owsjtld | 프로젝트 포트폴리오</title>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Apple SD Gothic Neo', sans-serif; padding: 2rem; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        header { margin-bottom: 3rem; text-align: center; }
        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; }
        
        /* 레포지토리 카드 그리드 */
        .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .repo-card { 
            background: var(--card-bg); padding: 1.5rem; border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;
            text-decoration: none; color: inherit; display: flex; flex-direction: column;
        }
        .repo-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.5); }
        .repo-name { font-weight: bold; color: var(--primary); font-size: 1.3rem; margin-bottom: 0.8rem; }
        .repo-desc { font-size: 0.95rem; opacity: 0.8; line-height: 1.5; flex-grow: 1; margin-bottom: 1rem; }
        .repo-footer { font-size: 0.8rem; display: flex; justify-content: space-between; color: #94a3b8; }
        
        .loading { text-align: center; font-size: 1.2rem; margin-top: 5rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>owsjtld Project List</h1>
            <p>직접 개발하고 관리하는 GitHub 저장소 목록입니다.</p>
        </header>
        
        <div id="repos" class="repo-grid">
            <div class="loading">데이터를 불러오는 중...</div>
        </div>
    </div>

    <script>
        async function fetchRepos() {
            const username = 'owsjtld';
            const repoContainer = document.getElementById('repos');

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                const repos = await response.json();

                repoContainer.innerHTML = ''; 

                repos.forEach(repo => {
                    if (!repo.fork) {
                        const card = document.createElement('a');
                        card.className = 'repo-card';
                        // 클릭 시 project.html로 이동하며 저장소 이름을 쿼리 스트링으로 전달
                        card.href = `project.html?repo=${repo.name}`;

                        card.innerHTML = `
                            <div class="repo-name">${repo.name}</div>
                            <div class="repo-desc">${repo.description || '이 프로젝트에 대한 간단한 설명이 아직 없습니다.'}</div>
                            <div class="repo-footer">
                                <span>● ${repo.language || 'Etc'}</span>
                                <span>자세히 보기 &rarr;</span>
                            </div>
                        `;
                        repoContainer.appendChild(card);
                    }
                });
            } catch (error) {
                repoContainer.innerHTML = '<p>GitHub 데이터를 가져오지 못했습니다.</p>';
            }
        }
        fetchRepos();
    </script>
</body>
</html>
