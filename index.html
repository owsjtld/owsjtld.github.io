<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>owsjtld's Game Center</title>
    <style>
        body { background: #222; color: white; text-align: center; margin: 0; overflow: hidden; }
        canvas { background: #000; display: block; margin: 20px auto; border: 2px solid #555; }
        .info { font-family: sans-serif; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <h1>Mini Brick Breaker</h1>
        <p>마우스를 움직여 바를 조절하세요!</p>
    </div>
    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 2;
        let dy = -2;
        const ballRadius = 10;
        const paddleHeight = 10;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;

        document.addEventListener("mousemove", (e) => {
            const relativeX = e.clientX - canvas.offsetLeft;
            if(relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 공 그리기
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();

            // 패들 그리기
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();

            // 벽 충돌 로직
            if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height - ballRadius) {
                if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
                else {
                    alert("GAME OVER");
                    document.location.reload();
                    clearInterval(interval);
                }
            }

            x += dx;
            y += dy;
        }
        const interval = setInterval(draw, 10);
    </script>
</body>
</html>
