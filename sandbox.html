<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자유 연습 — CODE-LEARN</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">CODE-LEARN</a>
  <nav>
    <a href="sandbox.html" class="active">자유 연습</a>
    <a href="missions.html">미션</a>
  </nav>
</header>

<main>
  <h1 style="margin-bottom:4px;">자유 연습</h1>
  <p style="color:var(--muted); margin-top:0;">왼쪽에 HTML/CSS/JS를 입력하면 오른쪽에 바로 결과가 보여요. 마음껏 실험해보세요.</p>

  <div class="mission-actions" style="margin-bottom:16px;">
    <button type="button" class="btn" id="reset-btn">초기 코드로 되돌리기</button>
  </div>

  <div id="playground"></div>
</main>

<script src="assets/js/editor.js"></script>
<script>
  var STARTER = {
    html: "<h1>안녕하세요!</h1>\n<p>여기에 자유롭게 HTML을 작성해보세요.</p>\n<button id=\"my-btn\">클릭</button>",
    css: "body {\n  font-family: sans-serif;\n  padding: 24px;\n}\n\nbutton {\n  padding: 8px 16px;\n  cursor: pointer;\n}",
    js: "document.getElementById('my-btn').addEventListener('click', function () {\n  alert('버튼이 눌렸어요!');\n});"
  };

  var pg = createPlayground(document.getElementById("playground"), STARTER);

  document.getElementById("reset-btn").addEventListener("click", function () {
    pg.setCode(STARTER);
  });
</script>
</body>
</html>
